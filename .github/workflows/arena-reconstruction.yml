name: Arena reconstruction
on:
  push:
    branches: [fix/arena-canonical-reconstruction]
  pull_request:
    paths:
      - 'src/features/commercial-map/**'
      - 'src/test/commercialMapArena*'
      - 'src/test/commercialMapParkEnvironment*'
      - 'scripts/arena*'
      - '.github/workflows/arena-reconstruction.yml'
permissions:
  contents: read
concurrency:
  group: arena-reconstruction-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VITE_SUPABASE_URL: https://qa.invalid
      VITE_SUPABASE_PUBLISHABLE_KEY: qa-placeholder
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.0'
      - run: bun install --frozen-lockfile
      - name: Arena contracts
        run: |
          mkdir -p arena-validation
          git rev-parse HEAD > arena-validation/commit.txt
          npx vitest run src/test/commercialMapArena src/test/commercialMapParkEnvironment --reporter=json --outputFile=arena-validation/tests.json
      - name: TypeScript
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Production build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee arena-validation/build.log
      - name: Install browser
        run: |
          python -m pip install playwright==1.57.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Real-map views and performance
        run: |
          npm run dev -- --host 127.0.0.1 --port 4186 > arena-validation/server.log 2>&1 &
          for i in $(seq 1 45); do curl -fsS http://127.0.0.1:4186 > /dev/null && break; sleep 1; done
          python scripts/arena-capture.py --phase current-main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arena-validation-${{ github.sha }}
          path: arena-validation/
          retention-days: 14
