name: Stage Playwright integer clock
on:
  push:
    branches: [chore/alvorada-motion-css-stage]
    paths: ['.github/workflows/alvorada-clock-api-stage.yml']
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify and stage one test file; no ref mutations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,hashlib,json,os,urllib.request
          def api(path,data=None):
              req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+path,data=None if data is None else json.dumps(data).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=60) as r:return json.load(r)
          source=base64.b64decode(api('/git/blobs/8aff8d71e13b16124722f9ec4f9c395f5c48e5c0')['content']).decode()
          for before,after in [('if remaining_ms < .0001:','if remaining_ms < .5:'),('await page.clock.run_for(min(16, remaining_ms))','await page.clock.run_for(min(16, round(remaining_ms)))')]:
              assert source.count(before)==1
              source=source.replace(before,after)
          data=source.encode();actual=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          assert actual=='20afa43e919bfb6e9fb3e3370ee0f8c640821d99'
          compile(source,'alvorada-motion-qa.py','exec')
          print('STAGED_BLOB='+api('/git/blobs',{'content':base64.b64encode(data).decode(),'encoding':'base64'})['sha'])
          PY
