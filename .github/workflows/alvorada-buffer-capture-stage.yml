name: Stage drawing-buffer QA capture
on:
  push:
    branches: [chore/alvorada-motion-css-stage]
    paths: ['.github/workflows/alvorada-buffer-capture-stage.yml']
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Apply verified two-file QA patch; stage objects only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,gzip,hashlib,json,os,pathlib,subprocess,urllib.request
          def api(path,data=None):
              req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+path,data=None if data is None else json.dumps(data).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=60) as r:return json.load(r)
          def blob(sha):return base64.b64decode(api('/git/blobs/'+sha)['content'])
          sources={'scripts/alvorada-motion-qa.py':'20afa43e919bfb6e9fb3e3370ee0f8c640821d99','scripts/alvorada-motion-qa.tsx':'e4c08f435070c9dea1964e82876a002c85be9b07'}
          for path,sha in sources.items():
              file=pathlib.Path(path);file.parent.mkdir(parents=True,exist_ok=True);file.write_bytes(blob(sha))
          archive=blob('b7740b90399e3f6878183582cdf0a66680248936')
          assert hashlib.sha256(archive).hexdigest()=='e233694b83f2bdfa870fc5894930b3a140f6d45b0c81e2d93c5d59b2bcc0093e'
          patch=pathlib.Path('reviewed.patch');patch.write_bytes(gzip.decompress(archive))
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          paths=[line.split('\t',2)[2] for line in subprocess.check_output(['git','apply','--numstat',str(patch)],text=True).splitlines()]
          assert set(paths)==set(sources)
          subprocess.run(['git','apply',str(patch)],check=True)
          expected={'scripts/alvorada-motion-qa.py':'2265668011dec4dad847df07436d14867ca23f43','scripts/alvorada-motion-qa.tsx':'f84255ba8764cfc071639bc9bd1a92f0b0ecc7b1'}
          for path in paths:
              data=pathlib.Path(path).read_bytes();sha=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert sha==expected[path],(path,sha)
              print(path,api('/git/blobs',{'content':base64.b64encode(data).decode(),'encoding':'base64'})['sha'])
          PY
