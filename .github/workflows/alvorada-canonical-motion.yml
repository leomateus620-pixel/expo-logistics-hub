name: Alvorada canonical motion
on:
  push:
    branches: [fix/alvorada-canonical-motion]
  pull_request:
    paths:
      - 'src/features/alvorada/**'
      - 'src/components/portal/FenasojaPortalHero.tsx'
      - 'src/index.css'
      - 'src/styles/commission-portal.css'
      - 'src/test/alvorada*'
      - 'scripts/alvorada-motion*'
      - '.github/workflows/alvorada-canonical-motion.yml'
permissions:
  contents: read
concurrency:
  group: alvorada-motion-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  canonical-motion:
    runs-on: ubuntu-24.04
    # Twelve independent scene boots and GPU readbacks, not animation duration.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-desktop, chromium-mobile, webkit-desktop, webkit-mobile]
    env:
      VITE_SUPABASE_URL: https://qa.invalid
      VITE_SUPABASE_PUBLISHABLE_KEY: qa-placeholder
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.0'
      - run: bun install --frozen-lockfile
      - name: Unit and integration contracts
        run: |
          mkdir -p runtime-motion
          git rev-parse HEAD > runtime-motion/commit.txt
          npx vitest run src/test/alvorada --reporter=json --outputFile=runtime-motion/unit-tests.json
      - name: TypeScript
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Production build and production-built fixture
        run: |
          set -o pipefail
          npm run build 2>&1 | tee runtime-motion/build.log
          node scripts/alvorada-motion-build.mjs 2>&1 | tee runtime-motion/fixture-build.log
      - name: Install Chromium and WebKit
        run: |
          python -m pip install playwright==1.57.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium webkit
      - name: Full motion ON/OFF browser and visual assertions
        run: |
          python -m http.server 4181 --bind 127.0.0.1 --directory dist-alvorada-motion > runtime-motion/server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4181/scripts/alvorada-motion-qa.html > /dev/null && break; sleep 1; done
          python scripts/alvorada-motion-qa.py --project ${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alvorada-canonical-motion-${{ matrix.project }}-${{ github.sha }}
          path: runtime-motion/
          retention-days: 14
