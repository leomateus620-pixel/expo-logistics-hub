name: Alvorada reviewed motion patch
on:
  push:
    branches: [fix/alvorada-canonical-motion]
    paths: ['.github/workflows/alvorada-motion-apply.yml']
permissions:
  contents: write
jobs:
  stage-reviewed-tree:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify and apply reviewed patch; stage objects only, no ref changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p runtime-motion-stage
          python - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, subprocess, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          def api(path, data=None):
              request = urllib.request.Request('https://api.github.com/repos/' + repo + path,
                  data=None if data is None else json.dumps(data).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          parts = ['b4d8fb2ede3930e5c806c89ee6588ea4b60b7aed', '718b38c229057b3c1a9fca0a4f74786ea5e8f295', 'e6303ca3cda8ad93ef010f539a708fcc9748786e']
          archive = b''.join(base64.b64decode(api('/git/blobs/' + sha)['content']) for sha in parts)
          assert hashlib.sha256(archive).hexdigest() == 'c65905cb4af90cdacf6255ac80d650ecd4ec52e8aa3a4c9efc3221255619672d'
          patch = pathlib.Path('runtime-motion-stage/reviewed.patch')
          patch.write_bytes(gzip.decompress(archive))
          subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
          stats = subprocess.check_output(['git', 'apply', '--numstat', str(patch)], text=True)
          paths = [line.split('\t', 2)[2] for line in stats.splitlines()]
          assert len(paths) == len(set(paths))
          for path in paths:
              assert path.startswith(('src/features/alvorada/', 'src/test/alvorada', 'scripts/alvorada-')) or path in (
                  'src/components/portal/FenasojaPortalHero.tsx', 'src/index.css',
                  'src/styles/commission-portal.css', '.github/workflows/alvorada-canonical-motion.yml'), path
          subprocess.run(['git', 'apply', str(patch)], check=True)
          entries = []
          for path in paths:
              file = pathlib.Path(path)
              sha = api('/git/blobs', {'content': base64.b64encode(file.read_bytes()).decode(), 'encoding': 'base64'})['sha'] if file.exists() else None
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': sha})
          entries.append({'path': '.github/workflows/alvorada-motion-apply.yml', 'mode': '100644', 'type': 'blob', 'sha': None})
          parent = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          base = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          tree = api('/git/trees', {'base_tree': base, 'tree': entries})['sha']
          result = {'parent': parent, 'tree': tree, 'entries': entries, 'patchSha256': hashlib.sha256(patch.read_bytes()).hexdigest(), 'refsChanged': False}
          pathlib.Path('runtime-motion-stage/review-tree.json').write_text(json.dumps(result, indent=2))
          print('REVIEW_TREE=' + tree)
          print('PARENT=' + parent)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alvorada-motion-review-tree-${{ github.sha }}
          path: runtime-motion-stage/
          retention-days: 7
