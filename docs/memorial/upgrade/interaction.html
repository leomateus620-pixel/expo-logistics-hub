<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memorial · registro da interação</title><style>body{margin:0;background:#101512;color:#ebd7ac;font:16px system-ui;text-align:center}main{max-width:1200px;margin:auto;padding:24px}h1{font:32px Georgia}img{display:block;max-width:100%;height:70vh;object-fit:contain;margin:16px auto}button{min-height:44px;background:#2e291e;border:1px solid #ad9258;border-radius:6px;color:inherit;padding:8px 16px;margin:4px}p{color:#d2c8b1}small{display:block;color:#b5b19f}</style><main><h1>Memorial do Voluntariado</h1><p id="caption"></p><img id="frame" alt="Captura da jornada"><button id="previous">Anterior</button><button id="play">Reproduzir</button><button id="next">Próxima</button><small>Registro em etapas capturadas no navegador. Reprodução de capturas; não é vídeo contínuo nem medição de fluidez.</small></main><script>
const frames=[['interaction-1-gallery.jpg','1 · Edição escolhida na exposição'],['interaction-2-inspection.jpg','2 · Um clique abre o quadro sobre a galeria'],['interaction-3-manipulation.jpg','3 · Giro, aproximação e deslocamento da região ampliada'],['interaction-4-return.jpg','4 · Retorno preserva o zoom e a posição']];let index=0,timer;const image=document.querySelector('#frame'),caption=document.querySelector('#caption'),play=document.querySelector('#play');function show(){image.src='evidence/'+frames[index][0];image.alt=frames[index][1];caption.textContent=frames[index][1]}function step(d){index=(index+d+frames.length)%frames.length;show()}document.querySelector('#previous').onclick=()=>step(-1);document.querySelector('#next').onclick=()=>step(1);play.onclick=()=>{if(timer){clearInterval(timer);timer=undefined;play.textContent='Reproduzir'}else{timer=setInterval(()=>step(1),1800);play.textContent='Pausar'}};show();</script></html>
