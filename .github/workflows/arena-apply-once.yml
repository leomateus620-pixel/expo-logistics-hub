name: Apply audited Arena reconstruction once
on:
  push:
    branches: [fix/arena-canonical-reconstruction]
    paths: ['.github/arena-transfer/**', '.github/workflows/arena-apply-once.yml']
permissions:
  contents: write
jobs:
  apply:
    if: >-
      github.repository == 'leomateus620-pixel/expo-logistics-hub' &&
      github.ref == 'refs/heads/fix/arena-canonical-reconstruction' &&
      github.event.head_commit.message == 'chore(arena): publish source using content-only workflow credentials'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
          ref: ${{ github.sha }}
      - name: Verify and apply exact source changes
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, json, pathlib, subprocess
          run = lambda *args: subprocess.check_output(args, text=True).strip()
          encoded = ''.join(p.read_text() for p in sorted(pathlib.Path('.github/arena-transfer').glob('part-*.b64')))
          compressed = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(compressed).hexdigest() == 'aa64596bbddedec23c3eab66a6bdd8fa2a35f0a49b032013436fdc4a5015733d'
          payload = json.loads(gzip.decompress(compressed))
          assert payload['base'] == '8885b12ce57635fc440e21e70fa1dfda6a169fef'
          subprocess.run(['git','merge-base','--is-ancestor',payload['base'],'HEAD'], check=True)
          allowed = {'scripts/arena-capture.py','scripts/arena-compare-tests.py','.github/workflows/arena-reconstruction.yml'}
          for item in payload['files']:
              assert item['path'] in allowed
              path = pathlib.Path(item['path'])
              if item['expected'] is None:
                  assert not path.exists()
              else:
                  assert run('git','hash-object',str(path)) == item['expected']
          patch = pathlib.Path('/tmp/arena-reviewed.patch'); patch.write_text(payload['patch'])
          subprocess.run(['git','apply','--check',str(patch)], check=True)
          subprocess.run(['git','apply',str(patch)], check=True)
          for item in payload['files']:
              # Workflow publication is handled by the authorized connector,
              # never by this content-only Actions token.
              if item['path'].startswith('.github/workflows/'):
                  continue
              pathlib.Path(item['path']).write_text(item['content'])
          def replace(path, old, new):
              p=pathlib.Path(path); s=p.read_text(); assert old in s,(path,old); p.write_text(s.replace(old,new))
          p='src/test/commercialMapRearRoadGround.test.ts'
          replace(p,"import { describe, expect, it } from 'vitest';", "import { describe, expect, it } from 'vitest';\nimport { ARENA_VEGETATION, arenaVegetationAllowed } from '@/features/commercial-map/data/arenaCanonicalLayout';")
          replace(p,'preserva o inventário de 20 árvores e remove somente copas da pista na apresentação','usa o inventário canônico e mantém copas fora das superfícies e da pista')
          replace(p,'expect(ARENA_FRONT_LAYOUT.treeClusters).toHaveLength(20);','expect(ARENA_FRONT_LAYOUT.treeClusters).toBe(ARENA_VEGETATION);\n    ARENA_VEGETATION.forEach(tree => expect(arenaVegetationAllowed(officialPdfPointToLocal(tree.sourcePosition), tree.scale * 0.3)).toBe(true));')
          p='src/test/commercialMapStrategicLandmarks.test.ts'
          replace(p,"import { describe, expect, it } from 'vitest';", "import { describe, expect, it } from 'vitest';\nimport { ARENA_CANONICAL_LAYOUT } from '@/features/commercial-map/data/arenaCanonicalLayout';")
          replace(p,'expect(arenaBounds.width).toBeCloseTo(10.5818, 4);','expect(arenaBounds.width).toBeCloseTo(ARENA_CANONICAL_LAYOUT.arenaDepth, 6);')
          replace(p,'expect(arenaBounds.depth).toBeCloseTo(9.6, 4);','expect(arenaBounds.depth).toBeCloseTo(ARENA_CANONICAL_LAYOUT.arenaWidth, 6);')
          replace(p,'expect(strategicLandmarkVisualHeight(entity)).toBeGreaterThan(entity.geometry.extrusionHeight);',"if (entity.publicIdentifier === 'F') {\n          expect(strategicLandmarkVisualHeight(entity)).toBeCloseTo(entity.geometry.extrusionHeight);\n        } else {\n          expect(strategicLandmarkVisualHeight(entity)).toBeGreaterThan(entity.geometry.extrusionHeight);\n        }")
          changed = run('git','diff','--name-only').splitlines()
          assert all(p.startswith(('src/features/commercial-map/','src/test/')) or p == 'package.json' or p in allowed for p in changed), changed
          assert not any(p.startswith('.github/workflows/') for p in changed)
          PY
      - name: Publish implementation to the feature branch only
        shell: bash
        run: |
          git config user.name 'leomateus620-pixel'
          git config user.email 'leomateus620-pixel@users.noreply.github.com'
          git add src/features/commercial-map package.json
          git commit -m 'feat(arena): reconstruct canonical open vault and aligned spatial sector'
          git add src/test scripts/arena-capture.py scripts/arena-compare-tests.py
          git commit -m 'test(arena): protect Mirante and validate canonical geometry and planting'
          git rm -r .github/arena-transfer
          git commit -m 'chore(arena): remove reconstruction payload after source application'
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/fix/arena-canonical-reconstruction
