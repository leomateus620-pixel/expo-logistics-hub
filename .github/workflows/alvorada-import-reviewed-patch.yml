# One-use patch transport. The resulting review tree removes this workflow.
# It NEVER updates a branch, merges a PR, or deploys the application.
name: Alvorada prepared patch validation
on:
  push:
    branches: [fix/alvorada-canonical-portal-runtime]
    paths: ['.github/workflows/alvorada-import-reviewed-patch.yml']
permissions:
  contents: write
jobs:
  validate-prepared-patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.0'
      - name: Apply exact prepared patch
        id: apply
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p runtime-patch-validation
          python - <<'PY'
          import base64, gzip, hashlib, json, pathlib, subprocess
          repo = 'leomateus620-pixel/expo-logistics-hub'
          parts = ['bd818b1a25b957bd08c617e1a18f67f709ea6d70', 'aacd7cb2a72552d336de34419157b20e2521ca57', '6f68c3457b14a058091808fc836b9c74e60194ab']
          encoded = b''
          for sha in parts:
              response = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/git/blobs/{sha}']))
              piece = base64.b64decode(response['content'])
              assert hashlib.sha1(b'blob ' + str(len(piece)).encode() + b'\0' + piece).hexdigest() == sha
              encoded += piece
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '479ef4a4c409f947ae50c7b5dc0c5bf975f624e54140a9573ff6cbd5af1b2719'
          pathlib.Path('runtime-patch-validation/prepared.patch').write_bytes(patch)
          paths = [line[6:] for line in patch.decode().splitlines() if line.startswith('+++ b/')]
          assert all(path.startswith(('src/', 'public/')) or path == 'vite.config.ts' for path in paths)
          subprocess.run(['git', 'apply', '--check', 'runtime-patch-validation/prepared.patch'], check=True)
          subprocess.run(['git', 'apply', 'runtime-patch-validation/prepared.patch'], check=True)
          pathlib.Path('runtime-patch-validation/paths.json').write_text(json.dumps(paths))
          PY
      - name: Install locked dependencies
        id: install
        run: bun install --frozen-lockfile
      - name: Alvorada unit and integration tests
        run: npx vitest run src/test/alvorada --reporter=json --outputFile=runtime-patch-validation/tests.json
      - name: Production build of prepared changes
        if: always() && steps.apply.outcome == 'success' && steps.install.outcome == 'success'
        run: |
          set -o pipefail
          npm run build 2>&1 | tee runtime-patch-validation/build.log
      - name: Typecheck
        if: always() && steps.apply.outcome == 'success' && steps.install.outcome == 'success'
        run: |
          set -o pipefail
          npx tsc --noEmit -p tsconfig.app.json 2>&1 | tee runtime-patch-validation/types.log
      - name: Stage review tree without updating any ref
        if: always() && steps.apply.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, json, pathlib, subprocess
          repo = 'leomateus620-pixel/expo-logistics-hub'
          def api(endpoint, payload):
              completed = subprocess.run(['gh', 'api', '--method', 'POST', f'repos/{repo}/{endpoint}', '--input', '-'], input=json.dumps(payload), text=True, capture_output=True, check=True)
              return json.loads(completed.stdout)
          entries = []
          paths = json.loads(pathlib.Path('runtime-patch-validation/paths.json').read_text())
          for path in paths:
              blob = api('git/blobs', {'encoding': 'base64', 'content': base64.b64encode(pathlib.Path(path).read_bytes()).decode()})
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          entries.append({'path': '.github/workflows/alvorada-import-reviewed-patch.yml', 'mode': '100644', 'type': 'blob', 'sha': None})
          parent = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          base_tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          result = api('git/trees', {'base_tree': base_tree, 'tree': entries})
          summary = {'parent': parent, 'tree': result['sha'], 'changedPaths': paths, 'patchSha256': '479ef4a4c409f947ae50c7b5dc0c5bf975f624e54140a9573ff6cbd5af1b2719', 'refUpdated': False}
          pathlib.Path('runtime-patch-validation/review-tree.json').write_text(json.dumps(summary, indent=2))
          print(json.dumps(summary, indent=2))
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write('## Prepared review tree\n\n```json\n' + json.dumps(summary, indent=2) + '\n```\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alvorada-prepared-patch-${{ github.sha }}
          path: runtime-patch-validation/
          retention-days: 7
