name: Arena reconstruction
on:
  push:
    branches: [fix/arena-canonical-reconstruction]
  pull_request:
    paths:
      - 'src/features/commercial-map/**'
      - 'src/test/commercialMap*'
      - 'scripts/arena*'
      - '.github/workflows/arena-reconstruction.yml'
permissions:
  contents: read
concurrency:
  group: arena-reconstruction-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: https://qa.invalid
      VITE_SUPABASE_PUBLISHABLE_KEY: qa-placeholder
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: '1.3.0'}
      - run: bun install --frozen-lockfile
      - name: Full baseline and candidate suites
        run: |
          mkdir -p arena-validation
          git rev-parse HEAD > arena-validation/commit.txt
          git worktree add --detach /tmp/arena-base 8783fea7caaf8bd1ac395232b8beb85a262030ab
          ln -s "$PWD/node_modules" /tmp/arena-base/node_modules
          (cd /tmp/arena-base && npm test -- --reporter=json --outputFile="$GITHUB_WORKSPACE/arena-validation/before-tests.json") > arena-validation/before-tests.log 2>&1 || true
          npm test -- --reporter=json --outputFile=arena-validation/after-tests.json > arena-validation/after-tests.log 2>&1 || true
          python scripts/arena-compare-tests.py arena-validation/before-tests.json arena-validation/after-tests.json arena-validation/test-comparison.json
      - name: Arena, Mirante and road hard gates
        if: always()
        run: npx vitest run src/test/commercialMapArena src/test/commercialMapParkEnvironment src/test/commercialMapAnnexSpatialCorrections src/test/commercialMapRearRoadNetwork src/test/commercialMapRearRoadGround src/test/commercialMapStrategicLandmarks src/test/commercialMapMirante --reporter=json --outputFile=arena-validation/arena-tests.json
      - name: TypeScript
        if: always()
        run: npm run typecheck
      - name: Production build
        if: always()
        run: |
          set -o pipefail
          npm run build 2>&1 | tee arena-validation/build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'arena-contracts-${{ github.sha }}', path: arena-validation/, retention-days: 14}
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        viewport: [wide, desktop, mobile]
    env:
      VITE_SUPABASE_URL: https://qa.invalid
      VITE_SUPABASE_PUBLISHABLE_KEY: qa-placeholder
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: '1.3.0'}
      - run: bun install --frozen-lockfile
      - name: Browser and baseline worktree
        run: |
          python -m pip install playwright==1.57.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
          mkdir -p arena-validation
          git rev-parse HEAD > arena-validation/commit.txt
          git worktree add --detach /tmp/arena-base 8783fea7caaf8bd1ac395232b8beb85a262030ab
          ln -s "$PWD/node_modules" /tmp/arena-base/node_modules
          cp src/features/commercial-map/diagnostics/TerritoryQa.tsx /tmp/arena-base/src/features/commercial-map/diagnostics/TerritoryQa.tsx
      - name: Before — real map and fixed camera
        run: |
          (cd /tmp/arena-base && npm run dev -- --host 127.0.0.1 --port 4185) > arena-validation/before-server.log 2>&1 &
          for i in $(seq 1 45); do curl -fsS http://127.0.0.1:4185 > /dev/null && break; sleep 1; done
          python scripts/arena-capture.py --base http://127.0.0.1:4185 --phase before --viewport ${{ matrix.viewport }}
      - name: After — same real map, viewport and camera
        if: always()
        run: |
          npm run dev -- --host 127.0.0.1 --port 4186 > arena-validation/after-server.log 2>&1 &
          for i in $(seq 1 45); do curl -fsS http://127.0.0.1:4186 > /dev/null && break; sleep 1; done
          python scripts/arena-capture.py --phase after --viewport ${{ matrix.viewport }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'arena-views-${{ matrix.viewport }}-${{ github.sha }}', path: arena-validation/, retention-days: 14}
