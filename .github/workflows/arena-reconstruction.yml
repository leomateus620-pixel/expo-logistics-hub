name: Arena reconstruction
on:
  push:
    branches: [fix/arena-canonical-reconstruction]
  pull_request:
    paths:
      - 'src/features/commercial-map/**'
      - 'src/test/commercialMapArena*'
      - 'src/test/commercialMapParkEnvironment*'
      - 'scripts/arena*'
      - '.github/workflows/arena-reconstruction.yml'
permissions:
  contents: read
concurrency:
  group: arena-reconstruction-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: https://qa.invalid
      VITE_SUPABASE_PUBLISHABLE_KEY: qa-placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.0'
      - run: bun install --frozen-lockfile
      - name: Canonical source and offline dependencies
        run: |
          mkdir -p arena-validation offline-source offline-dependencies
          git rev-parse HEAD > arena-validation/commit.txt
          git archive HEAD src public scripts .github package.json package-lock.json bun.lock index.html vite.config.ts vitest.config.ts tsconfig.json tsconfig.app.json tsconfig.node.json tailwind.config.ts postcss.config.js eslint.config.js | gzip > offline-source/source.tgz
          git ls-files docs | grep -E '\.(md|ts|tsx|py|json)$' | tar -czf offline-source/documentation.tgz -T -
          tar -czf offline-dependencies/dependencies.tgz node_modules
      - name: Arena baseline contracts
        run: npx vitest run src/test/commercialMapArena src/test/commercialMapParkEnvironment --reporter=json --outputFile=arena-validation/tests.json
      - name: TypeScript
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Production build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee arena-validation/build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arena-validation-${{ github.sha }}
          path: arena-validation/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arena-source-${{ github.sha }}
          path: offline-source/
          retention-days: 3
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arena-dependencies-${{ github.sha }}
          path: offline-dependencies/
          retention-days: 3
          compression-level: 0
