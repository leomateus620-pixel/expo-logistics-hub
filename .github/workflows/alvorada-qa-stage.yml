name: Stage reviewed visual QA patch
on:
  push:
    branches: [chore/alvorada-motion-css-stage]
    paths: ['.github/workflows/alvorada-qa-stage.yml']
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify patch and create blobs; no ref updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p qa-stage
          python - <<'PY'
          import pathlib, subprocess, json, os, urllib.request, base64, gzip, hashlib
          def api(path, data=None):
              req = urllib.request.Request('https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + path, data=None if data is None else json.dumps(data).encode(), headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(req, timeout=60) as response: return json.load(response)
          archive = base64.b64decode(api('/git/blobs/775cf567888e07a6d66bbbde7a168597d2bfbe09')['content'])
          assert hashlib.sha256(archive).hexdigest() == '5ccb2cde74da3177ef0915e0cd543261b4c2fe3e0a27a9aeb8accd03b5501240'
          patch = pathlib.Path('qa-stage/reviewed.patch'); patch.write_bytes(gzip.decompress(archive))
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          paths = [line.split('\t',2)[2] for line in subprocess.check_output(['git','apply','--numstat',str(patch)],text=True).splitlines()]
          assert set(paths) == {'.github/workflows/alvorada-canonical-motion.yml','scripts/alvorada-motion-qa.py','scripts/alvorada-motion-qa.tsx','src/index.css'}
          subprocess.run(['git','apply',str(patch)],check=True)
          entries = []
          for path in paths:
              contents = pathlib.Path(path).read_bytes()
              sha = api('/git/blobs',{'content':base64.b64encode(contents).decode(),'encoding':'base64'})['sha']
              entries.append({'path':path,'mode':'100644','type':'blob','sha':sha})
          pathlib.Path('qa-stage/result.json').write_text(json.dumps({'entries':entries,'refsChanged':False},indent=2))
          print(json.dumps(entries))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alvorada-visual-qa-patch
          path: qa-stage/
          retention-days: 7
