name: Arena reconstruction
on:
  push:
    branches: [fix/arena-canonical-reconstruction]
  pull_request:
    paths:
      - 'src/components/map/**'
      - 'src/lib/map/**'
      - 'src/data/**'
      - 'src/test/*arena*'
      - 'src/test/*Arena*'
      - 'scripts/arena*'
      - '.github/workflows/arena-reconstruction.yml'
permissions:
  contents: read
concurrency:
  group: arena-reconstruction-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: https://qa.invalid
      VITE_SUPABASE_PUBLISHABLE_KEY: qa-placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.0'
      - run: bun install --frozen-lockfile
      - name: Canonical source and offline dependencies
        run: |
          mkdir -p arena-validation
          git rev-parse HEAD > arena-validation/commit.txt
          git archive HEAD | gzip > arena-validation/source.tgz
          tar -czf arena-validation/dependencies.tgz node_modules
      - name: Arena baseline contracts
        run: |
          npx vitest run src/test/arena --reporter=json --outputFile=arena-validation/tests.json
      - name: TypeScript
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Production build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee arena-validation/build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arena-validation-${{ github.sha }}
          path: arena-validation/
          retention-days: 7
          compression-level: 0
