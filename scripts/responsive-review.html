<!doctype html><html lang="pt-BR"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Revisão responsiva local</title><style>body{margin:0;background:#25384a;color:#f4e8ce;font:12px system-ui}header{display:flex;align-items:center;gap:8px;padding:8px;flex-wrap:wrap}button{min-height:32px;border:1px solid #c0aa74;background:#0d2138;color:inherit;border-radius:6px;padding:3px 8px;cursor:pointer}iframe{display:block;border:0;background:white;transform-origin:top left}#stage{overflow:auto;padding:8px}output{display:block;white-space:pre-wrap;padding:8px;background:#081725;line-height:1.4}</style><header><strong>QA local · componentes com dados de demonstração</strong><button data-size="1440,900">1440 × 900</button><button data-size="1366,768">1366 × 768</button><button data-size="1280,720">1280 × 720</button><button data-size="390,844">390 × 844</button><button data-size="393,852">393 × 852</button><button data-size="430,932">430 × 932</button><button data-size="360,800">360 × 800</button><button data-size="1280,600">1280 × 600</button><button data-size="844,390">844 × 390</button><button data-size="720,450">Reflow 200%</button><button id="measure">Medir</button></header><output id="report" aria-live="polite">Carregando…</output><div id="stage"><iframe title="Interface em revisão"></iframe></div><script type="module">
const frame=document.querySelector('iframe');const params=new URLSearchParams(location.search);frame.src=params.get('target')||'/scripts/alvorada-qa.html?graph';let width=1440,height=900;
function size(w,h){width=w;height=h;frame.style.width=w+'px';frame.style.height=h+'px';const reserved=document.querySelector('header').offsetHeight+document.querySelector('#report').offsetHeight+24;const scale=Math.min(1,(innerWidth-16)/w,Math.max(180,innerHeight-reserved)/h);frame.style.transform=`scale(${scale})`;document.querySelector('#stage').style.height=(h*scale)+'px';frame.style.marginBottom=(-(1-scale)*h)+'px';}
function measure(){try{const d=frame.contentDocument;const q=s=>d.querySelector(s);const box=s=>{const e=typeof s==='string'?q(s):s;const b=e?.getBoundingClientRect();return b?{x:+b.x.toFixed(1),y:+b.y.toFixed(1),w:+b.width.toFixed(1),h:+b.height.toFixed(1),bottom:+b.bottom.toFixed(1)}:null};const ready=q('.org-ecosystem__ready');const root=d.documentElement;const nodes=[...d.querySelectorAll('.org-node')];const rings=nodes.filter(n=>n.dataset.horizontal).map(n=>box(n.querySelector('.org-node__ring')));const footer=box('.org-bottom-bar');const captions=nodes.map(n=>n.querySelector('.org-node__copy').getBoundingClientRect());let crossings=0;for(const p of d.querySelectorAll('.org-relationship__path')){const m=p.getScreenCTM();for(let t=0;t<=p.getTotalLength();t+=3){const a=p.getPointAtLength(t),x=a.x*m.a+m.e,y=a.y*m.d+m.f;if(captions.some(b=>x>b.left+1&&x<b.right-1&&y>b.top+1&&y<b.bottom-1)){crossings++;break;}}}
const data={viewport:[frame.contentWindow.innerWidth,frame.contentWindow.innerHeight],scroll:[root.scrollWidth,root.scrollHeight],mode:ready?.dataset.layoutMode,scale:ready?.dataset.viewportScale,upperPortraitCenters:rings.map(b=>+(b.x+b.w/2).toFixed(1)),upperPortraitTops:rings.map(b=>b.y),nodes:nodes.length,inside:footer?nodes.every(n=>[n.querySelector('.org-node__ring'),n.querySelector('.org-node__copy')].every(e=>{const b=e.getBoundingClientRect();return b.left>=-.5&&b.right<=width+.5&&b.top>=0&&b.bottom<=footer.y+.5})):undefined,connectorCaptionCrossings:crossings,area:box('.commercial-dashboard-area-card'),sales:box('.commercial-dashboard-sales-summary'),signature:box('.commercial-dashboard-signature-inline'),finance:[...d.querySelectorAll('.commercial-dashboard-overview-finance')].map(box),kpiTop:box('.commercial-dashboard-overview__kpis')?.y,bot:box('[data-workers-launcher]'),botSlot:q('[data-workers-launcher-slot]')?.dataset.workersLauncherSlot,playing:ready?.dataset.presentation};const report=data.area?{viewport:data.viewport,scroll:data.scroll,area:data.area,sales:data.sales,signature:data.signature,financeHeights:data.finance.map(b=>b.h),kpiTop:data.kpiTop}:data.bot?{viewport:data.viewport,scroll:data.scroll,bot:data.bot,slot:data.botSlot}:{viewport:data.viewport,scroll:data.scroll,mode:data.mode,scale:data.scale,centers:data.upperPortraitCenters,tops:data.upperPortraitTops,nodes:data.nodes,inside:data.inside,crossings:data.connectorCaptionCrossings,presentation:data.playing};document.querySelector('#report').textContent=JSON.stringify(report);return report;}catch(e){document.querySelector('#report').textContent=e.message;}}
for(const b of document.querySelectorAll('[data-size]'))b.onclick=()=>{size(...b.dataset.size.split(',').map(Number));};document.querySelector('#measure').onclick=measure;frame.onload=()=>{size(width,height);setTimeout(measure,500);};size(width,height);setInterval(measure,1200);window.addEventListener('resize',()=>size(width,height));
</script></html>
