name: Territorial reconstruction
on:
  push:
    branches: [fix/test-drive-pecuaria-access]
  pull_request:
    paths:
      - 'src/features/commercial-map/**'
      - 'src/test/commercialMap*'
      - 'scripts/territorial*'
      - '.github/workflows/territorial-reconstruction.yml'
permissions:
  contents: read
concurrency:
  group: territorial-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [standard, wide, mobile]
    env:
      VITE_SUPABASE_URL: https://qa.invalid
      VITE_SUPABASE_PUBLISHABLE_KEY: qa-placeholder
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Map contracts
        run: |
          mkdir -p territorial-validation
          git rev-parse HEAD > territorial-validation/commit.txt
          npx vitest run src/test/commercialMap --reporter=json --outputFile=territorial-validation/tests.json
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee territorial-validation/build.log
      - name: Browser
        run: |
          python -m pip install playwright==1.57.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Real-map views and metrics
        run: |
          npm run dev -- --host 127.0.0.1 --port 4188 > territorial-validation/server.log 2>&1 &
          for i in $(seq 1 45); do curl -fsS http://127.0.0.1:4188 > /dev/null && break; sleep 1; done
          python scripts/territorial-capture.py --project ${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: territorial-validation-${{ matrix.project }}-${{ github.sha }}
          path: territorial-validation/
          retention-days: 14
